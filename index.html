<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse — Mobile Test</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>ECLIPSE</h1>
        <section id="terminal" aria-label="Eclipse terminal">
            <div id="terminal-output" role="log" aria-live="off"></div>
            <span id="cursor" class="cursor" aria-hidden="true">█</span>
            <div class="command-row">
                <label for="command">&gt;</label>
                <input type="text" id="command" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command" disabled>
                <span id="input-cursor" class="cursor" aria-hidden="true" hidden>█</span>
            </div>
        </section>
    </main>
    <script src="js/terminal/terminal-engine.js"></script>
    <script src="js/terminal/effects.js"></script>
    <script src="js/terminal/sequences.js"></script>
    <script src="js/terminal/commands.js?v=2"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            EclipseTerminal.init();
            EclipseCommands.init();
            EclipseCommands.setInputEnabled(false);
            try {
                await EclipseTerminal.run(() => EclipseSequences.boot());
            } finally {
                EclipseCommands.setInputEnabled(true);
            }
        });
    </script>
</body>
</html>
